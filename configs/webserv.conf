server {
    listen 8080;
    host 127.0.0.1;

    server_name localhost;

    root ./www;

    client_max_body_size 1000000;

    error_page 404 ./www/errors/404.html;
    error_page 500 ./www/errors/500.html;

    location / {
        allowed_methods GET;
        index index.html;
        autoindex off;
    }

    location /files {
        allowed_methods GET;
        root ./www/files;
        autoindex on;
    }

    location /upload {
        allowed_methods GET POST DELETE;
        root ./www/uploads;
        upload_path ./www/uploads;
        autoindex on;
    }

    location /old-page {
        allowed_methods GET;
        return 301 /new-page;
    }

    location /cgi-bin {
        allowed_methods GET POST;

        root ./www/cgi-bin;

        cgi_extension .py;
        cgi_path /usr/bin/python3;
    }
}
