server {
    host 127.0.0.1;
    listen 8080;
    listen 8081;
    server_name localhost;
    root ./www;
    client_max_body_size 1000000;
    error_page 404 ./www/errors/404.html;
    error_page 500 ./www/errors/500.html;

    location / {
        allowed_methods GET;
        index index.html;
        autoindex off;
    }
    location /files {
        allowed_methods GET;
        root ./www/files;
        autoindex on;
    }
    location /upload {
        allowed_methods GET POST DELETE;
        root ./www/uploads;
        upload_path ./www/uploads;
        autoindex on;
    }
    location /old-page {
        return 301 /new-page;
    }
    location /cgi-bin {
        allowed_methods GET POST;
        root ./www/cgi-bin;
        cgi_extension .py;
        cgi_path /usr/bin/python3;
    }
}

server {
    host 127.0.0.1;
    listen 9090;
    server_name second-site;
    root ./www/second-site;
    client_max_body_size 500000;

    location / {
        allowed_methods GET;
        index index.html;
        autoindex off;
    }
}
